<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#161B22" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DDC97" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3DDC97" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3DDC97" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#3DDC97" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0"/>
    </linearGradient>
    <filter id="gf1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gf2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      <![CDATA[
        .letter {
          opacity: 0;
          animation: type 6.5s infinite;
        }
        .cursor {
          animation: blink 1.05s step-end infinite, moveCursor 6.5s infinite;
        }

        @keyframes type {
          0%   { opacity: 0; }
          3%   { opacity: 1; }
          45%  { opacity: 1; }
          48%  { opacity: 0; }
          100% { opacity: 0; }
        }

        @keyframes moveCursor {
          0%   { transform: translateX(0px); }
          3%   { transform: translateX(23px); }
          6%   { transform: translateX(46px); }
          9%   { transform: translateX(69px); }
          12%  { transform: translateX(92px); }
          15%  { transform: translateX(115px); }
          18%  { transform: translateX(138px); }
          21%  { transform: translateX(161px); }
          24%  { transform: translateX(184px); }
          27%  { transform: translateX(207px); }
          30%  { transform: translateX(230px); }
          33%  { transform: translateX(253px); }
          36%  { transform: translateX(276px); }
          39%  { transform: translateX(299px); }
          42%  { transform: translateX(322px); }
          45%  { transform: translateX(345px); }
          48%  { transform: translateX(368px); }
          51%  { transform: translateX(391px); }
          54%  { transform: translateX(414px); }
          57%  { transform: translateX(437px); }
          60%  { transform: translateX(460px); }
          63%  { transform: translateX(483px); }
          66%  { transform: translateX(506px); }
          70%  { transform: translateX(506px); } /* hold */
          73%  { transform: translateX(483px); }
          76%  { transform: translateX(460px); }
          79%  { transform: translateX(437px); }
          82%  { transform: translateX(414px); }
          85%  { transform: translateX(391px); }
          88%  { transform: translateX(368px); }
          91%  { transform: translateX(345px); }
          94%  { transform: translateX(322px); }
          97%  { transform: translateX(299px); }
          100% { transform: translateX(0px); }
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50%      { opacity: 0; }
        }
      ]]>
    </style>
  </defs>

  <!-- BASE -->
  <rect width="900" height="300" fill="#0D1117"/>
  <rect width="900" height="300" fill="url(#g)" opacity="0.55"/>
  
  <!-- Scanner beam -->
  <rect x="0" y="-60" width="900" height="120" fill="url(#sg)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,420" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- FRAME -->
  <rect x="0" y="0" width="4" height="300" fill="#3DDC97">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <line x1="4" y1="1" x2="896" y2="1" stroke="#21262D" stroke-width="1"/>
  <line x1="4" y1="299" x2="896" y2="299" stroke="#21262D" stroke-width="1"/>

  <!-- STATUS BAR -->
  <circle cx="28" cy="32" r="5" fill="#3DDC97">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6.5;4" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="41" y="37" font-family="Courier New,Courier,monospace" font-size="11" fill="#3DDC97" letter-spacing="1.5">SYSTEM ONLINE</text>
  <text x="640" y="37" font-family="Courier New,Courier,monospace" font-size="10" fill="#2D333B" letter-spacing="0.5">PID:2026 MEM:∞ GPU:ACTIVE MODEL:BUILDING</text>

  <!-- NEURAL NETWORK (shortened for brevity - same as before) -->
  <circle cx="820" cy="118" r="20" fill="none" stroke="#3DDC97" stroke-width="0.6">
    <animate attributeName="r" values="16;25;16" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="118" r="5.5" fill="none" stroke="#3DDC97" stroke-width="2">
    <animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="118" r="2" fill="#3DDC97">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== NAME WITH CSS ===================== -->
  <g font-family="Courier New, Courier, monospace" font-size="38" font-weight="900">
    <!-- MUNAGALA SAI HANISH -->
    <text x="28"  y="168" class="letter" style="animation-delay: 0.00s; fill:#E6EDF3; filter:url(#gf1)">M</text>
    <text x="51"  y="168" class="letter" style="animation-delay: 0.13s; fill:#E6EDF3; filter:url(#gf1)">U</text>
    <text x="74"  y="168" class="letter" style="animation-delay: 0.26s; fill:#E6EDF3; filter:url(#gf1)">N</text>
    <text x="97"  y="168" class="letter" style="animation-delay: 0.39s; fill:#E6EDF3; filter:url(#gf1)">A</text>
    <text x="120" y="168" class="letter" style="animation-delay: 0.52s; fill:#E6EDF3; filter:url(#gf1)">G</text>
    <text x="143" y="168" class="letter" style="animation-delay: 0.65s; fill:#E6EDF3; filter:url(#gf1)">A</text>
    <text x="166" y="168" class="letter" style="animation-delay: 0.78s; fill:#E6EDF3; filter:url(#gf1)">L</text>
    <text x="189" y="168" class="letter" style="animation-delay: 0.91s; fill:#E6EDF3; filter:url(#gf1)">A</text>
    <text x="212" y="168" class="letter" style="animation-delay: 1.04s; fill:#E6EDF3; filter:url(#gf1)"> </text>
    <text x="235" y="168" class="letter" style="animation-delay: 1.17s; fill:#E6EDF3; filter:url(#gf1)">S</text>
    <text x="258" y="168" class="letter" style="animation-delay: 1.30s; fill:#E6EDF3; filter:url(#gf1)">A</text>
    <text x="281" y="168" class="letter" style="animation-delay: 1.43s; fill:#E6EDF3; filter:url(#gf1)">I</text>
    <text x="304" y="168" class="letter" style="animation-delay: 1.56s; fill:#E6EDF3; filter:url(#gf1)"> </text>
    <text x="327" y="168" class="letter" style="animation-delay: 1.69s; fill:#E6EDF3; filter:url(#gf1)">H</text>
    <text x="350" y="168" class="letter" style="animation-delay: 1.82s; fill:#E6EDF3; filter:url(#gf1)">A</text>
    <text x="373" y="168" class="letter" style="animation-delay: 1.95s; fill:#E6EDF3; filter:url(#gf1)">N</text>
    <text x="396" y="168" class="letter" style="animation-delay: 2.08s; fill:#E6EDF3; filter:url(#gf1)">I</text>
    <text x="419" y="168" class="letter" style="animation-delay: 2.21s; fill:#E6EDF3; filter:url(#gf1)">S</text>
    <text x="442" y="168" class="letter" style="animation-delay: 2.34s; fill:#E6EDF3; filter:url(#gf1)">H</text>

    <!-- .AI -->
    <text x="465" y="168" class="letter" style="animation-delay: 2.47s; fill:#3DDC97; filter:url(#gf2)">.</text>
    <text x="488" y="168" class="letter" style="animation-delay: 2.60s; fill:#3DDC97; filter:url(#gf2)">A</text>
    <text x="511" y="168" class="letter" style="animation-delay: 2.73s; fill:#3DDC97; filter:url(#gf2)">I</text>
  </g>

  <!-- CURSOR -->
  <rect x="28" y="128" width="11" height="42" fill="#3DDC97" class="cursor"/>

  <!-- Tagline -->
  <text x="28" y="208" font-family="Courier New,Courier,monospace" font-size="13" fill="#7D8590" letter-spacing="2.5">
    EMERGING AI ENGINEER · BUILDING INTELLIGENT SYSTEMS
  </text>

  <!-- Skills -->
  <text x="28" y="250" font-family="Courier New,Courier,monospace" font-size="11" fill="#3DDC97" opacity="0.85" letter-spacing="1.2">
    [ RAG · LLMs · RETRIEVAL · VECTOR_SEARCH · EMBEDDINGS · PYTHON · AGENTIC_AI ]
  </text>

  <!-- Version -->
  <text x="810" y="293" font-family="Courier New,monospace" font-size="9" fill="#2D333B">v2026.1 // MunagalaSaiHanish</text>
</svg>
